name: Weekly Smart Scraper

on:
  schedule:
    # Runs at 14:00 (2:00 PM) UTC every Sunday. 
    # (Adjust if you meant 2:00 PM IST, which would be 08:30 UTC: '30 8 * * 0')
    - cron: '0 14 * * 0'
  
  # Allows you to trigger this workflow manually from the Actions tab
  workflow_dispatch:

# Ensure workflow has permissions to commit back to the repository
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so diffs work properly
          fetch-depth: 0 

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches pip dependencies for faster runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 groq

      - name: Run Smart Scraper
        env:
          # Securely pull the API key from GitHub Repository Secrets
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scraper/smart_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if emergencyContacts.json was actually modified
          if git diff --exit-code src/data/emergencyContacts.json > /dev/null; then
            echo "No changes detected in emergencyContacts.json. Nothing to commit."
          else
            echo "Updates detected! Committing changes..."
            git add src/data/emergencyContacts.json
            git commit -m "chore(data): auto-update government emergency contacts [skip ci]"
            git push
          fi
